<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Placeholder 11 mm lit button cap, frame 0 (released): dark
     ring + gradient cap, after Rack's VCVButton. The light (9.4 mm) is drawn
     on top by the module (AlButtonLight). Theme-independent, like the ports. -->
<svg width="11mm" height="11mm" viewBox="0 0 11 11" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cap" gradientUnits="userSpaceOnUse" x1="0" y1="0.3" x2="0" y2="10.7">
      <stop offset="0" style="stop-color:#807c7e;stop-opacity:1" />
      <stop offset="1" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="5.5" cy="5.5" r="5.5" style="fill:#0a0a0a;stroke:none" />
  <circle cx="5.5" cy="5.5" r="5.2" style="fill:url(#cap);stroke:none" />
</svg>
